<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https://huiwen-md.invalid; font-src data:; base-uri 'none'; form-action 'none'">
  <title>Markdown 预览</title>
  <style>/* HUIWEN_PREVIEW_STYLE */</style>
</head>
<body>
  <main id="markdown-body" class="markdown-body"></main>
  <script>/* HUIWEN_PREVIEW_SCRIPT */</script>
  <script>
    window.HuiwenPreview = {
      ...window.HuiwenMarkdown,
      receive: window.HuiwenMarkdown.receiveWorkspace,
      showPreview(source) {
        if (location.pathname === '/editor.html' || location.pathname === '/live.html') {
          window.HuiwenMarkdown.showWorkspace(source);
          return;
        }
        window.HuiwenMarkdown.showPreview(source);
        window.huiwenReportPreview?.(true, '');
      }
    };
  </script>
</body>
</html>
